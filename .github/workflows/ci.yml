name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install package with dev dependencies
        run: |
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install pytest PyMuPDF python-docx beautifulsoup4 lxml markdown-it-py html2text chardet

      - name: Run doctor
        run: .venv/bin/python scripts/run_pipeline.py doctor

      - name: Run pytest
        run: .venv/bin/pytest